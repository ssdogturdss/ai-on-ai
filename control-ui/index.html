<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>CHIP Control</title>
    <style>
        body { font-family: -apple-system, system-ui; background: #000; color: #fff; margin:0; padding:20px; }
        .tab { display: none; }
        .tab.active { display: block; }
        button { background:#333; color:#fff; border:none; padding:12px; margin:5px; border-radius:8px; }
        input { width:100%; padding:12px; background:#111; color:#fff; border:1px solid #333; border-radius:8px; }
    </style>
</head>
<body>
    <h1>🤖 CHIP OS</h1>
    <div>
        <button onclick="showTab('chat')">CHAT</button>
        <button onclick="showTab('server')">SERVER</button>
        <button onclick="showTab('deploy')">DEPLOY</button>
    </div>
    
    <div id="chat" class="tab active">
        <h2>Chat</h2>
        <input id="msg" placeholder="Message to agent">
        <button onclick="sendChat()">Send</button>
        <pre id="chatOut"></pre>
    </div>
    
    <div id="server" class="tab">
        <h2>Server Status</h2>
        <button onclick="getStatus()">Refresh Status</button>
        <pre id="statusOut"></pre>
        <button onclick="getLogs()">Logs</button>
        <pre id="logOut"></pre>
    </div>
    
    <div id="deploy" class="tab">
        <h2>Deploy</h2>
        <button onclick="runCmd('git pull')">git pull</button>
        <button onclick="runCmd('npm install')">npm install</button>
        <button onclick="runCmd('pm2 restart all')">restart</button>
    </div>
    
    <script>
        const API = 'http://' + location.hostname + ':8000';
        
        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
        }
        
        async function sendChat() {
            const msg = document.getElementById('msg').value;
            const res = await fetch(API + '/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({message:msg})});
            document.getElementById('chatOut').textContent = JSON.stringify(await res.json(), null, 2);
        }
        
        async function getStatus() {
            const res = await fetch(API + '/status');
            document.getElementById('statusOut').textContent = JSON.stringify(await res.json(), null, 2);
        }
        
        async function getLogs() {
            const res = await fetch(API + '/logs');
            document.getElementById('logOut').textContent = JSON.stringify(await res.json(), null, 2);
        }
        
        async function runCmd(cmd) {
            const res = await fetch(API + '/run', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({command:cmd})});
            alert(JSON.stringify(await res.json()));
        }
        
        // PWA ready
    </script>
</body>
</html>
